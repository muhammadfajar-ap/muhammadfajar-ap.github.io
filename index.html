    biz:[
      ["Creative Specialist & Lead Photographer","3Miles Photography","Des 2021 – Jul 2024","Bisnis fotografi dan videografi, dijalankan bersama rekan."],
      ["Pemilik","Benih Tani","Mei 2021 – Jun 2023","Bisnis pertanian online yang menjual benih padi."]
    ],
    edu:[["S1 Ilmu Komunikasi","Universitas Terbuka","2020 – Target lulus 2027",""]],
    dom:[
      ["Operasional Pelabuhan & Kargo","Pengawasan bongkar muat kapal, rekonsiliasi DO, pengendalian tally"],
      ["Gudang & Persediaan","Penerimaan barang, stock opname, pencatatan stok"],
      ["Proses & Pelaporan","Perancangan SOP, laporan aktivitas, pelaporan Excel otomatis"]
    ],
    tool:[
      ["Alat","Microsoft Excel (SUMIF, Pivot Table, Dashboard), Google Workspace, Canva, AI Tools"],
      ["Bahasa","Indonesia (Native), Inggris (Menengah – TOEPS 566)"]
    ]
  }
};

let lang = "en";
const $ = (s) => document.querySelector(s);
let openCaseId = null;

function timeline(el, items) {
  el.innerHTML = items.map(i => `
    <li class="pl-5 relative">
      <span class="absolute -left-[5px] top-1.5 h-2.5 w-2.5 rounded-full bg-forest"></span>
      <p class="font-head font-semibold">${i[0]}</p>
      <p class="text-sm text-slate2">${i[1]}</p>
      <p class="text-xs text-slate2 mt-0.5">${i[2]}</p>
      ${i[3] ? `<p class="text-sm text-slate2 mt-2 leading-relaxed">${i[3]}</p>` : ""}
    </li>`).join("");
}

function renderModal() {
  if (!openCaseId) return;
  const t = translations[lang], c = t.cases[openCaseId];
  $("#mTitle").textContent = c.t;
  const block = (label, text) => `<div><h4 class="font-head font-semibold text-forest mb-1">${label}</h4><p class="text-slate2">${text}</p></div>`;
  $("#mBody").innerHTML = block(t.prob, c.p) + block(t.act, c.a) + block(t.res, c.r) + block(t.tools, c.tl) +
    `<a href="${CONFIG.github[openCaseId]}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 bg-forest text-white font-semibold rounded-lg px-4 py-2.5"><i data-lucide="github" class="w-4 h-4"></i>${t.repo}</a>`;
  hydrateIcons();
}

function setLang(l) {
  lang = l;
  const t = translations[l];
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
  $("#cvLink").setAttribute("href", CONFIG.cv[l]);
  $("#thumb").style.transform = l === "en" ? "translateX(0)" : "translateX(100%)";
  $("#lEN").className = "relative z-10 px-3 py-1.5 " + (l === "en" ? "text-white" : "text-slate2");
  $("#lID").className = "relative z-10 px-3 py-1.5 " + (l === "id" ? "text-white" : "text-slate2");
  timeline($("#tl_pro"), t.pro); timeline($("#tl_biz"), t.biz); timeline($("#tl_edu"), t.edu);
  $("#domList").innerHTML = t.dom.map(d => `<li class="flex gap-3"><i data-lucide="check" class="w-4 h-4 mt-0.5 text-forest shrink-0"></i><span><b class="font-semibold">${d[0]}</b><br><span class="text-slate2">${d[1]}</span></span></li>`).join("");
  $("#toolList").innerHTML = t.tool.map(d => `<div><dt class="font-semibold">${d[0]}</dt><dd class="text-slate2 mt-0.5">${d[1]}</dd></div>`).join("");
  try { localStorage.setItem("lang", l); } catch (e) {}
  renderModal();
  hydrateIcons();
}

function openCase(id) { openCaseId = id; $("#modal").hidden = false; document.body.style.overflow = "hidden"; renderModal(); $("#mClose").focus(); }
function closeCase() { openCaseId = null; $("#modal").hidden = true; document.body.style.overflow = ""; }

document.querySelectorAll(".open-case").forEach(b => b.addEventListener("click", () => openCase(b.dataset.case)));
$("#mClose").addEventListener("click", closeCase);
$("#backdrop").addEventListener("click", closeCase);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCase(); });
$("#langToggle").addEventListener("click", () => setLang(lang === "en" ? "id" : "en"));

let saved = (navigator.language || "").startsWith("id") ? "id" : "en";
try { saved = localStorage.getItem("lang") || saved; } catch (e) {}
applyConfig();
setLang(saved);
</script>
</body>
</html>
